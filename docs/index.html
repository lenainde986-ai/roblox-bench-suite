<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AznoCheats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--surface:#0e0e12;--surface2:#14141a;--border:#1f1f28;--text:#f0f0f5;--muted:#8b8b9a;--red:#e11d2e;--red-bright:#ff2a3d;--red-dim:rgba(225,29,46,.15);--red-glow:rgba(225,29,46,.35);--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(225,29,46,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(225,29,46,.03) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 75%)}
header{position:sticky;top:0;z-index:100;background:rgba(7,7,9,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-top{max-width:1200px;margin:0 auto;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.15rem;letter-spacing:.04em;display:flex;align-items:center;gap:.5rem}
.logo-icon{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--red),#9b1220);display:grid;place-items:center;font-size:14px}
.logo span{color:var(--red-bright)}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.875rem;font-weight:500}
.nav-links a:hover{color:var(--text)}
.btn-red{background:var(--red);color:#fff;border:none;padding:.5rem 1.1rem;border-radius:8px;font-weight:600;font-size:.875rem;cursor:pointer;text-decoration:none}
.btn-red:hover{background:var(--red-bright);box-shadow:0 0 20px var(--red-glow)}
.hero{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:4.5rem 1.5rem 2.5rem;text-align:center}
.hero-title{font-size:clamp(2.8rem,7vw,5rem);font-weight:800;letter-spacing:-.03em;line-height:1;background:linear-gradient(180deg,#fff 30%,var(--red-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px var(--red-glow));margin-bottom:.2rem}
.hero-sub{font-size:1.1rem;font-weight:500;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:1.5rem}
.stats-bar{display:inline-flex;flex-wrap:wrap;gap:.35rem 1.1rem;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:.5rem 1.2rem;font-size:.78rem;color:var(--muted);margin-bottom:1.75rem}
.stats-bar strong{color:var(--text)}
.stats-bar .sep{color:var(--border)}
.section{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.section-label{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:.35rem}
.section-title{font-size:1.6rem;font-weight:700;margin-bottom:.4rem}
.section-desc{color:var(--muted);font-size:.92rem;margin-bottom:1.5rem;max-width:520px}
.menu-preview{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;max-width:620px}
.menu-bar{padding:.5rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--muted);display:flex;justify-content:space-between}
.live{color:var(--green);font-size:.62rem;font-weight:700}
.menu-stage{padding:1.4rem;background:#0a0a0e;display:flex;justify-content:center}
.win{width:100%;max-width:540px;height:360px;border-radius:10px;overflow:hidden;border:1px solid #2a2a35;box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;background:#101016;user-select:none}
.side{width:120px;background:#0c0c10;flex-shrink:0;border-right:1px solid #1a1a22;display:flex;flex-direction:column}
.side-logo{height:42px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;color:var(--red-bright);letter-spacing:.04em}
.side-tab{margin:2px 7px;padding:8px 10px;border-radius:6px;font-size:11.5px;font-weight:500;color:#8b8b9a;cursor:pointer;transition:background .12s,color .12s}
.side-tab:hover{background:#1a1a22;color:#ccc}
.side-tab.active{background:var(--red);color:#fff}
.body{flex:1;overflow-y:auto;padding:8px 10px}
.body::-webkit-scrollbar{width:3px}
.body::-webkit-scrollbar-thumb{background:var(--red);border-radius:4px}
.sec{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.06em;margin:8px 0 5px 2px}
.sec:first-child{margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;background:#16161e;border-radius:6px;padding:6px 11px;margin-bottom:4px}
.row span{font-size:11.5px;color:#d0d0dc}
.sw{width:34px;height:17px;border-radius:99px;background:#323240;position:relative;cursor:pointer;transition:background .15s;flex-shrink:0}
.sw.on{background:var(--red)}
.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{left:19px}
.speed-row{display:flex;align-items:center;justify-content:space-between;background:#16161e;border-radius:6px;padding:6px 11px;margin-bottom:4px}
.speed-row span{font-size:11.5px;color:#d0d0dc}
.speed-btns{display:flex;gap:3px}
.speed-btns button{width:26px;height:20px;border:none;border-radius:4px;background:#282834;color:#ddd;font-weight:700;font-size:12px;cursor:pointer}
.page{display:none}.page.active{display:block}
footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:1.75rem;text-align:center;color:var(--muted);font-size:.78rem}
footer a{color:var(--red-bright);text-decoration:none}
</style>
</head>
<body>
<div class="grid-bg"></div>
<header>
  <div class="nav-top">
    <div class="logo"><div class="logo-icon">A</div> AZNO<span>CHEATS</span></div>
    <div class="nav-links">
      <a href="#previews">Preview</a>
      <a class="btn-red" href="https://github.com/lenainde986-ai/roblox-bench-suite" target="_blank">Get Access</a>
    </div>
  </div>
</header>

<section class="hero">
  <h1 class="hero-title">AZNOCHEATS</h1>
  <p class="hero-sub">Private Suite</p>
  <div class="stats-bar">
    <span><strong>5</strong> Tabs</span>
    <span class="sep">|</span>
    <span><strong>World</strong> Character Aim Visuals Games</span>
    <span class="sep">|</span>
    <span><strong>AuthKey</strong></span>
  </div>
</section>

<section class="section" id="previews">
  <div class="section-label">Interactive</div>
  <h2 class="section-title">Live Menu Preview</h2>
  <p class="section-desc">Click the sidebar tabs. Every toggle works.</p>
  <div class="menu-preview">
    <div class="menu-bar"><span>AznoCheats</span><span class="live">● LIVE</span></div>
    <div class="menu-stage">
      <div class="win">
        <div class="side">
          <div class="side-logo">AZNOCHEATS</div>
          <div class="side-tab active" data-tab="world">World</div>
          <div class="side-tab" data-tab="character">Character</div>
          <div class="side-tab" data-tab="aim">Aim</div>
          <div class="side-tab" data-tab="visuals">Visuals</div>
          <div class="side-tab" data-tab="games">Games</div>
        </div>
        <div class="body">
          <div class="page active" id="page-world"></div>
          <div class="page" id="page-character"></div>
          <div class="page" id="page-aim"></div>
          <div class="page" id="page-visuals"></div>
          <div class="page" id="page-games"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer>AznoCheats · Multi-tab · <a href="https://github.com/lenainde986-ai/roblox-bench-suite" target="_blank">GitHub</a></footer>

<script>
const pages = {
  world: [
    ['sec','ENVIRONMENT'],
    ['t','Fullbright'],['t','No Fog'],['t','X-Ray (translucent)'],['t','Low Gravity']
  ],
  character: [
    ['sec','MOVEMENT'],
    ['t','Fly'],['t','Infinite Jump'],['t','Noclip'],
    ['n','Speed',16],
    ['sec','PROTECTION'],
    ['t','God Mode'],['t','Inf Stamina']
  ],
  aim: [
    ['sec','AIMBOT'],
    ['t','Aimbot'],['t','Silent Aim'],['t','Triggerbot'],
    ['t','Team Check',true],['t','Visible Check',true],
    ['n','FOV',120],['n','Smooth',5]
  ],
  visuals: [
    ['sec','PLAYER ESP'],
    ['t','Enable ESP'],['t','Box ESP'],['t','Name ESP'],
    ['t','Distance ESP'],['t','Tracers'],['t','Chams']
  ],
  games: [
    ['sec','BEE SWARM SIMULATOR'],
    ['t','Load BSS'],['t','Auto Farm'],['t','Auto Dig'],['t','Auto Convert'],
    ['t','Collect Tokens',true],['t','Kill Bugs',true],['t','BSS ESP',true],
    ['sec','LUMBER TYCOON 2'],
    ['t','Load LT2'],['t','Auto Chop'],['t','Auto Sell'],['t','Tree ESP',true]
  ]
};

function buildPage(id, items) {
  const el = document.getElementById('page-' + id);
  items.forEach(it => {
    if (it[0] === 'sec') {
      const d = document.createElement('div');
      d.className = 'sec'; d.textContent = it[1];
      el.appendChild(d);
    } else if (it[0] === 't') {
      const row = document.createElement('div');
      row.className = 'row';
      const span = document.createElement('span');
      span.textContent = it[1];
      const sw = document.createElement('div');
      sw.className = 'sw' + (it[2] ? ' on' : '');
      sw.innerHTML = '<i></i>';
      sw.onclick = () => sw.classList.toggle('on');
      row.appendChild(span); row.appendChild(sw);
      el.appendChild(row);
    } else if (it[0] === 'n') {
      const row = document.createElement('div');
      row.className = 'speed-row';
      let v = it[2];
      const span = document.createElement('span');
      span.textContent = it[1] + ': ' + v;
      const btns = document.createElement('div');
      btns.className = 'speed-btns';
      const m = document.createElement('button'); m.textContent = '-';
      const p = document.createElement('button'); p.textContent = '+';
      m.onclick = () => { v = Math.max(1, v-5); span.textContent = it[1]+': '+v; };
      p.onclick = () => { v = Math.min(300, v+5); span.textContent = it[1]+': '+v; };
      btns.appendChild(m); btns.appendChild(p);
      row.appendChild(span); row.appendChild(btns);
      el.appendChild(row);
    }
  });
}

Object.keys(pages).forEach(k => buildPage(k, pages[k]));

document.querySelectorAll('.side-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
